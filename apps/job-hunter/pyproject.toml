[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "reportlab>=4.1",
    "google-auth>=2.40",
    "google-auth-oauthlib>=1.2",
    "PyJWT[crypto]>=2.8",
    "pydantic>=2.7",
    # Ingestion's direct, pooled Postgres connection (#182). Everything
    # user-facing still goes through PostgREST; this is the transport that
    # makes COPY and set-based merges available to the crawl.
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
webhook = [
    "Flask>=3.1,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Supabase stack; skipped when none is reachable",
]

[tool.vercel]
entrypoint = "main:app"
