name: Daily Job Hunter
on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'
      timezone: "Europe/Berlin"
permissions:
  contents: read
  actions: read
concurrency:
  group: job-hunter-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Restore prior state
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_state.py --repo "$GH_REPO" --token "$GH_TOKEN" --dest var/job_hunter.sqlite3
      - name: Sync Gmail intelligence
        continue-on-error: true
        timeout-minutes: 20
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FREE_RPM: ${{ vars.GEMINI_FREE_RPM }}
          GEMINI_FREE_TPM: ${{ vars.GEMINI_FREE_TPM }}
          GEMINI_FREE_RPD: ${{ vars.GEMINI_FREE_RPD }}
          GEMINI_RUN_ID: ${{ github.run_id }}
        run: python -m job_hunter sync-gmail
      - name: Run job hunter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FREE_RPM: ${{ vars.GEMINI_FREE_RPM }}
          GEMINI_FREE_TPM: ${{ vars.GEMINI_FREE_TPM }}
          GEMINI_FREE_RPD: ${{ vars.GEMINI_FREE_RPD }}
          GEMINI_RUN_ID: ${{ github.run_id }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BRAVE_MONTHLY_QUERY_LIMIT: ${{ vars.BRAVE_MONTHLY_QUERY_LIMIT || '250' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDIDATE_PROFILE_B64: ${{ secrets.CANDIDATE_PROFILE_B64 }}
          COVER_LETTER_TEMPLATE_B64: ${{ secrets.COVER_LETTER_TEMPLATE_B64 }}
        run: python -m job_hunter run
      - name: Upload state artifact
        if: always() && hashFiles('var/job_hunter.sqlite3') != ''
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-state
          path: var/job_hunter.sqlite3
          retention-days: 90
