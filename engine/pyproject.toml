[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "PyJWT[crypto]>=2.8",
    "pydantic>=2.7",
    # Ingestion's direct, pooled Postgres connection (#182). Everything
    # user-facing still goes through PostgREST; this is the transport that
    # makes COPY and set-based merges available to the crawl.
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.6",
]
lint = [
    "import-linter>=2.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Supabase stack; skipped when none is reachable",
]
