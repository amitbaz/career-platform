name: Job Hunter CI
on:
  push:
    branches: [main]
    paths:
      - 'apps/job-hunter/**'
      - 'supabase/**'
      - '.github/workflows/job-hunter-ci.yml'
  pull_request:
    paths:
      - 'apps/job-hunter/**'
      - 'supabase/**'
      - '.github/workflows/job-hunter-ci.yml'
defaults:
  run:
    working-directory: apps/job-hunter
jobs:
  test:
    runs-on: [self-hosted, career-platform]
    env:
      SUPABASE_PROJECT_ID: career-platform-ci-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/job-hunter/pyproject.toml
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # This runner is a developer machine, not an ephemeral VM: a Supabase
      # stack is already up on the default ports, shared by every worktree
      # (see AGENTS.md). CI therefore gets its own containers, through
      # SUPABASE_PROJECT_ID, and its own ports, by shifting every 543xx in the
      # checked-out config.toml. That checkout is disposable and re-cleaned
      # each run, so the rewrite is never committed and no developer sees it.
      - name: Isolate this job's Supabase stack
        working-directory: .
        run: perl -pi -e 's/\b543(\d{2})\b/553$1/g' supabase/config.toml
      - name: Generate a throwaway signing key
        working-directory: .
        run: bash supabase/local-signing-key.sh
      - name: Start Supabase
        working-directory: .
        run: supabase start
      - run: pip install -e '.[test,webhook]'
      - name: Run the test suite
        working-directory: .
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_TEST_URL="$API_URL"
          export SUPABASE_TEST_PUBLISHABLE_KEY="$ANON_KEY"
          # The keys file is an array; the minter wants the single JWK object.
          export SUPABASE_TEST_SIGNING_KEY_B64="$(python3 -c "import json,base64;print(base64.b64encode(json.dumps(json.load(open('supabase/signing_keys.json'))[0]).encode()).decode())")"
          cd apps/job-hunter
          pytest -q

      # Self-hosted runners keep state between runs. Left alone, a stack
      # outlives its job, holds its ports, and then meets the next run's
      # freshly generated signing key -- which surfaces as an auth failure
      # rather than as the leak it is. --project-id keeps this to CI's own
      # stack; never --all, which would take the developer stack down too.
      - name: Stop this job's Supabase stack
        if: always()
        working-directory: .
        run: supabase stop --project-id career-platform-ci-test --no-backup || true

  isolation:
    # Proves a per-user token cannot cross users, against real policies on a
    # throwaway local Supabase stack. Nothing touches the hosted project.
    runs-on: [self-hosted, career-platform]
    env:
      SUPABASE_PROJECT_ID: career-platform-ci-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/job-hunter/pyproject.toml
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # This runner is a developer machine, not an ephemeral VM: a Supabase
      # stack is already up on the default ports, shared by every worktree
      # (see AGENTS.md). CI therefore gets its own containers, through
      # SUPABASE_PROJECT_ID, and its own ports, by shifting every 543xx in the
      # checked-out config.toml. That checkout is disposable and re-cleaned
      # each run, so the rewrite is never committed and no developer sees it.
      - name: Isolate this job's Supabase stack
        working-directory: .
        run: perl -pi -e 's/\b543(\d{2})\b/563$1/g' supabase/config.toml
      - name: Generate a throwaway signing key
        working-directory: .
        run: bash supabase/local-signing-key.sh
      - name: Start Supabase
        working-directory: .
        run: supabase start
      - run: pip install -e '.[test,webhook]'
      - name: Run the isolation test
        working-directory: .
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_TEST_URL="$API_URL"
          export SUPABASE_TEST_PUBLISHABLE_KEY="$ANON_KEY"
          # The keys file is an array; the minter wants the single JWK object.
          export SUPABASE_TEST_SIGNING_KEY_B64="$(python3 -c "import json,base64;print(base64.b64encode(json.dumps(json.load(open('supabase/signing_keys.json'))[0]).encode()).decode())")"
          cd apps/job-hunter
          pytest tests/integration -v --junit-xml=/tmp/isolation-results.xml
          python3 -c "
          import sys, xml.etree.ElementTree as ET
          root = ET.parse('/tmp/isolation-results.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          tests = int(suite.get('tests', 0))
          skipped = int(suite.get('skipped', 0))
          failures = int(suite.get('failures', 0))
          errors = int(suite.get('errors', 0))
          print(f'isolation suite results: tests={tests} skipped={skipped} failures={failures} errors={errors}')
          ok = tests > 0 and skipped == 0 and failures == 0 and errors == 0
          if not ok: print(f'::error::Isolation suite did not run clean ({tests} tests, {skipped} skipped, {failures} failures, {errors} errors). A skipped or uncollected test usually means the Supabase env vars never reached pytest -- that would be a false pass, not proof of isolation.')
          sys.exit(0 if ok else 1)
          "

      # Self-hosted runners keep state between runs. Left alone, a stack
      # outlives its job, holds its ports, and then meets the next run's
      # freshly generated signing key -- which surfaces as an auth failure
      # rather than as the leak it is. --project-id keeps this to CI's own
      # stack; never --all, which would take the developer stack down too.
      - name: Stop this job's Supabase stack
        if: always()
        working-directory: .
        run: supabase stop --project-id career-platform-ci-isolation --no-backup || true
