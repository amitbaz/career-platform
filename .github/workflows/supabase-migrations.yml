# Apply migrations to the live Supabase project when they reach main (#190).
#
# Nobody pushes migrations by hand. A worktree sitting on an unmerged branch that pushes
# first can permanently block a lower-numbered migration on another branch, because
# Supabase refuses a filename that sorts before one already applied. Making this the only
# path removes that possibility rather than discouraging it -- see AGENTS.md.
#
# `--db-url` is the CLI's own CI pattern: it targets the database directly and skips
# `supabase link`, so this needs one connection-string secret rather than an access token,
# a database password and a project ref -- and no Management API token scopes at all.
#
# SUPABASE_DB_URL must be the **session pooler** connection string, not the direct one:
# GitHub's runners are IPv4-only and a direct Supabase connection is IPv6-only without the
# IPv4 add-on. Transaction mode (port 6543) is also wrong here -- migrations need session
# mode for advisory locks and multi-statement transactions. The password inside it must be
# percent-encoded.
#
# `--include-all` is load-bearing, not a convenience. Two migrations reached main with their
# `29999999*` placeholder prefixes intact (#282, #284) and were applied to production under
# those versions. Every real `YYYYMMDDHHMMSS` timestamp sorts before them, so from #284
# onwards `db push` refused every migration that followed -- "Found local migration files to
# be inserted before the last migration on remote database" -- and #296's posting-recovery
# schema sat on main, unapplied, until #297. The two placeholder versions cannot be renumbered
# out of the way: the remote has already applied them under those numbers.
#
# So this workflow applies out-of-order migrations rather than refusing them, which is the
# remedy the CLI itself names in that error. What is lost is a guard against applying a
# migration whose number sorts before one already applied; what it was guarding against has
# already happened, and refusing now only keeps production behind main. Migrations here are
# independent DDL files and `supabase db reset` applies them in filename order locally, so
# discovery order and version order agree everywhere it matters.
#
# The cause is a process failure, not a CLI one: a placeholder must be renumbered to a real
# timestamp before its PR merges. See AGENTS.md, "Migration filenames are allocated across
# the whole repository".
name: Apply Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would be applied, and change nothing'
        type: boolean
        default: true

# Two applications must never overlap: the second would race the first's advisory locks
# and could report success against a half-applied set.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repository settings to gate
    # production behind an approval. Without that, a merge applies unattended.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # config.toml sets signing_keys_path, and that file is git-ignored, so the CLI
      # refuses to read its own config on a fresh checkout -- before it ever reaches the
      # database. The generated key is a throwaway for the local stack and is never used
      # by `db push --db-url`, which talks straight to the remote over the connection
      # string. relay-ci and engine-ci already do the same thing for the same reason.
      - name: Generate the throwaway local signing key
        run: bash supabase/local-signing-key.sh

      - name: Show what would be applied
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # --yes is required: db push prompts for confirmation, and without it the
      # step hangs until the job times out rather than failing.
      # Skipped only for a manual dry-run dispatch, which exists to verify the
      # connection secret without writing to production. A push to main always applies.
      - name: Apply
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Report what is applied
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
