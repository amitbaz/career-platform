# Every new issue is assigned to the owner, who decides at triage what happens
# to it. Review requests come from CODEOWNERS.
name: Assign

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Assign the new issue to the owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" --add-assignee amitbaz
