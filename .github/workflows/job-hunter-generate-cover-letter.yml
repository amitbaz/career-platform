name: Generate Cover Letter On Demand
on:
  repository_dispatch:
    types: [generate_cover_letter]
permissions:
  contents: read
concurrency:
  group: job-hunter-state
  cancel-in-progress: false
defaults:
  run:
    working-directory: apps/job-hunter
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/job-hunter/pyproject.toml
      - run: pip install -e .
      - name: Generate cover letter
        env:
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FREE_RPM: ${{ vars.GEMINI_FREE_RPM }}
          GEMINI_FREE_TPM: ${{ vars.GEMINI_FREE_TPM }}
          GEMINI_FREE_RPD: ${{ vars.GEMINI_FREE_RPD }}
          GEMINI_RUN_ID: ${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          JOB_HUNTER_USER_ID: ${{ secrets.JOB_HUNTER_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SIGNING_KEY_B64: ${{ secrets.SUPABASE_SIGNING_KEY_B64 }}
        run: python -m job_hunter generate-cover-letter --job-id "$JOB_ID"
