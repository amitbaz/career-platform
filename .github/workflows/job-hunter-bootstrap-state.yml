# One-shot migration helper: copies the newest job-hunter-state artifact from the
# pre-monorepo repository into this one, so the first scheduled run here does not
# start from an empty database.
#
# Run it once, confirm the artifact exists, then DELETE this file. Re-running it
# would overwrite newer state with the old repository's snapshot.
# See docs/monorepo-migration.md section 5.
name: Bootstrap Job Hunter state
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Repository to copy the newest job-hunter-state artifact from
        required: false
        default: amitbaz/job-hunter-bot
permissions:
  contents: read
  actions: read
concurrency:
  group: job-hunter-state
  cancel-in-progress: false
defaults:
  run:
    working-directory: apps/job-hunter
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/job-hunter/pyproject.toml
      - run: pip install -e .
      - name: Restore state from the source repository
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          # Reads a public repository's artifacts. For a private source, replace
          # this with a PAT holding actions:read on that repository.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_state.py --repo "$SOURCE_REPO" --token "$GH_TOKEN" --dest var/job_hunter.sqlite3
      - name: Fail if nothing was restored
        run: test -s var/job_hunter.sqlite3
      - name: Upload as this repository's state artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-state
          path: apps/job-hunter/var/job_hunter.sqlite3
          retention-days: 90
