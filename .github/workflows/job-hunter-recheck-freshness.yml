name: Recheck posting freshness
# The recheck_freshness stage's consumer (issue #186): closes postings that are
# gone and refreshes ones whose employer text changed. Its own workflow on its
# own schedule, so a slow pass can never delay the daily run's crawl or
# extraction.
#
# pg_cron decides what is due (job_hunter_enqueue_due_freshness, every 30
# minutes); this only drains the queue. Four runs a day is enough because the
# shortest re-check interval is six hours.
#
# Unlike job-hunter-daily.yml this does use GitHub's own schedule: there is no
# external trigger for it, so there is no second run to collide with.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Its own group, not job-hunter-state: it writes only shared posting rows over
# the privileged connection, never the per-user read-then-update pairs that
# group serialises.
concurrency:
  group: job-hunter-recheck-freshness
  cancel-in-progress: false
defaults:
  run:
    working-directory: apps/job-hunter
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/job-hunter/pyproject.toml
      - run: pip install -e .
      - name: Re-check due postings
        env:
          # Ingestion's direct, pooled Postgres connection -- the only thing
          # this needs. No user, no provider key: whether an advertisement
          # still exists is the same answer for everyone.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m job_hunter recheck-freshness
