name: Daily Job Hunter
# Scheduling is external: cron-job.org calls the workflow_dispatch API. There is
# deliberately no `schedule:` trigger here, so GitHub never starts a second run
# of its own. Do not add one back without retiring the cron-job.org job first.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: job-hunter-state
  cancel-in-progress: false
defaults:
  run:
    working-directory: apps/job-hunter
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/job-hunter/pyproject.toml
      - run: pip install -e .
      - name: Sync Gmail intelligence
        continue-on-error: true
        timeout-minutes: 20
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FREE_RPM: ${{ vars.GEMINI_FREE_RPM }}
          GEMINI_FREE_TPM: ${{ vars.GEMINI_FREE_TPM }}
          GEMINI_FREE_RPD: ${{ vars.GEMINI_FREE_RPD }}
          JOB_HUNTER_USER_ID: ${{ secrets.JOB_HUNTER_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SIGNING_KEY_B64: ${{ secrets.SUPABASE_SIGNING_KEY_B64 }}
        run: python -m job_hunter sync-gmail
      - name: Run job hunter
        env:
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FREE_RPM: ${{ vars.GEMINI_FREE_RPM }}
          GEMINI_FREE_TPM: ${{ vars.GEMINI_FREE_TPM }}
          GEMINI_FREE_RPD: ${{ vars.GEMINI_FREE_RPD }}
          BRAVE_MONTHLY_QUERY_LIMIT: ${{ vars.BRAVE_MONTHLY_QUERY_LIMIT || '250' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_HUNTER_USER_ID: ${{ secrets.JOB_HUNTER_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SIGNING_KEY_B64: ${{ secrets.SUPABASE_SIGNING_KEY_B64 }}
        run: python -m job_hunter run
