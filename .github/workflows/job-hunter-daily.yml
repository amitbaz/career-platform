name: Daily Job Hunter
# Scheduling is external: cron-job.org calls the workflow_dispatch API. There is
# deliberately no `schedule:` trigger here, so GitHub never starts a second run
# of its own. Do not add one back without retiring the cron-job.org job first.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: job-hunter-state
  cancel-in-progress: false
defaults:
  run:
    working-directory: apps/job-hunter
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/job-hunter/pyproject.toml
      - run: pip install -e .
      - name: Sync Gmail intelligence
        continue-on-error: true
        timeout-minutes: 20
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FREE_RPM: ${{ vars.GEMINI_FREE_RPM }}
          GEMINI_FREE_TPM: ${{ vars.GEMINI_FREE_TPM }}
          GEMINI_FREE_RPD: ${{ vars.GEMINI_FREE_RPD }}
          JOB_HUNTER_USER_ID: ${{ secrets.JOB_HUNTER_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SIGNING_KEY_B64: ${{ secrets.SUPABASE_SIGNING_KEY_B64 }}
        run: python -m job_hunter sync-gmail
      - name: Run job hunter
        env:
          # The platform-owned key that funds shared objective extraction
          # (issue #128). It is a repository secret rather than a per-user
          # credential because one key reads a posting once for every user.
          # Unset it and the run still completes -- but it reads no postings,
          # so no newly discovered job is scored and the digest empties out.
          # It never falls back to the user's own key.
          PLATFORM_GEMINI_API_KEY: ${{ secrets.PLATFORM_GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FREE_RPM: ${{ vars.GEMINI_FREE_RPM }}
          GEMINI_FREE_TPM: ${{ vars.GEMINI_FREE_TPM }}
          GEMINI_FREE_RPD: ${{ vars.GEMINI_FREE_RPD }}
          BRAVE_MONTHLY_QUERY_LIMIT: ${{ vars.BRAVE_MONTHLY_QUERY_LIMIT || '250' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_HUNTER_USER_ID: ${{ secrets.JOB_HUNTER_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SIGNING_KEY_B64: ${{ secrets.SUPABASE_SIGNING_KEY_B64 }}
          # Ingestion's direct, pooled Postgres connection (#182) -- the same
          # session-pooler string supabase-migrations.yml pushes with. Only
          # the crawl uses it, and only for the shared postings tables;
          # matching and every per-user read stay on PostgREST under row-level
          # security. Unset it and the run persists each posting inside its own
          # job upsert, slower and otherwise identical.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m job_hunter run
